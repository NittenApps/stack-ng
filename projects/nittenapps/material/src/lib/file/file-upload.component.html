<h2 mat-dialog-title>Cargar archivos</h2>
<mat-dialog-content>
  <input #file [accept]="validMIMETypes" [multiple]="multiple" style="display: none" type="file"
    (change)="onFilesAdded()" />
  <div class="container">
    <div style="text-align: right;">
      <button mat-raised-button class="add-files-btn" color="primary"
        [disabled]="uploading || uploadSuccessful || (!multiple && files.size > 0)" (click)="addFiles()">Agregar
        Archivos</button>
    </div>
    <mat-list>
      @for (file of files; track file) {
      <mat-list-item>
        <h4 mat-line>{{file.name}}</h4>
        @if (progress && !progress[file.name].error) {
        <mat-progress-bar mode="determinate" [value]="progress[file.name]!.progress | async"></mat-progress-bar>
        }
        @if (progress?.[file.name]?.error) {
        <span class="error">
          {{progress![file.name].error}}
        </span>
        }
      </mat-list-item>
      }
      <mat-list-item></mat-list-item>
    </mat-list>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-raised-button [disabled]="!canBeClosed || withError"
    (click)="closeDialog()">{{primaryButtonText}}</button>
  @if (showCancelButton) {
  <button mat-button mat-dialog-close [disabled]="!canBeClosed">Cancelar</button>
  }
</mat-dialog-actions>
